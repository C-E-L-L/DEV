services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: celldb
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-server:
    build:
      context: ./ai-server
    volumes:
      - ./ai-server/weights:/app/weights  # weights는 로컬에서 그대로 마운트
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # 모델 로딩 시간 고려

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/celldb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AI_SERVER_URL: http://ai-server:8001
      FILE_UPLOAD_DIR: /data/originals
      FILE_CROP_DIR: /data/crops
      FILE_THUMBNAIL_DIR: /data/thumbnails
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  colorizer:
    build:
      context: ./컬러화POC
    environment:
      COLORIZER_DATA_DIR: /data
      COLORIZER_SECRET_KEY: ${COLORIZER_SECRET_KEY}
      COLORIZER_SECURE_COOKIE: "1"
      COLORIZER_USER_STORAGE_LIMIT_GB: ${COLORIZER_USER_STORAGE_LIMIT_GB:-10}
    volumes:
      - colorizer-data:/data
    mem_limit: ${COLORIZER_MEMORY_LIMIT:-2g}
    cpus: ${COLORIZER_CPU_LIMIT:-1.5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:  # DB 데이터 영구 보존
  colorizer-data:  # 컬러화 계정, 작업 메타데이터 및 원본 DICOM 보존
