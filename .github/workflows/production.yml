name: Production CI and images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Backend tests
        working-directory: backend
        run: bash gradlew test --no-daemon
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          node --test src/utils/*.test.js mock/*.test.js
          npm run build
          node scripts/workflow-smoke.mjs
      - name: Colorizer tests
        working-directory: 컬러화POC
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
          node --test tests/roi_geometry.test.js
      - name: Deployment bundle and PowerShell tests
        run: |
          python -m unittest discover -s ops/deploy/tests -p 'test_*.py'
          pwsh -NoProfile -File ops/deploy/tests/Test-Deploy.ps1

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend
          - service: ai-server
            context: ai-server
          - service: colorizer
            context: 컬러화POC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image identity
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
          CONTEXT: ${{ matrix.context }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "tag=src-$(git rev-parse "HEAD:$CONTEXT")" >> "$GITHUB_OUTPUT"
      - name: Reuse an unchanged service image
        id: existing
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record immutable image reference
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: python -c 'import json,os; open(os.environ["SERVICE"]+".json","w").write(json.dumps({os.environ["SERVICE"]:os.environ["IMAGE"]}))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.json
          retention-days: 7

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: image-metadata
          merge-multiple: true
      - name: Create deployment assets
        run: |
          docker compose -f docker-compose.yml config --no-interpolate --no-path-resolution --no-env-resolution --format json > compose.source.json
          python ops/deploy/make_release.py
      - name: Publish complete production release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; this build will not become production.'
            exit 0
          fi
          tag="production-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Production ${GITHUB_SHA:0:12}" --draft --notes "Tests passed. Images are pinned by digest. Server deployment status is recorded on the server."
          gh release upload "$tag" release-assets/deploy.json release-assets/compose.json
          gh release edit "$tag" --draft=false --latest
