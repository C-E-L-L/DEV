# Local-only persistent database. Never reads the production DB_* credentials.
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.springframework.jdbc.core: INFO
app:
  cors:
    allowed-origins: http://127.0.0.1:15173,http://localhost:15173
spring:
  datasource:
    url: jdbc:h2:file:../.local/db/cell;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${LOCAL_DB_PASSWORD:}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
server:
  address: 127.0.0.1
  port: 18080
jwt:
  secret: ${LOCAL_JWT_SECRET}
  expiration-hours: 24
admin:
  username: local-admin
  password: ${LOCAL_ADMIN_PASSWORD}
ai-server:
  base-url: http://127.0.0.1:18001
file:
  upload-dir: ../data/originals
  crop-dir: ../data/crops
  thumbnail-dir: ../data/thumbnails
