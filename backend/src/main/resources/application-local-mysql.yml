# Activate alongside local: local,local-mysql
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/cell_local?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: cell_local
    password: ${LOCAL_DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
