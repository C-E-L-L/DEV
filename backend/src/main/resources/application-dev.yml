spring:
  datasource:
    url: jdbc:mysql://localhost:3306/celldb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "root"

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin1234!}

ai-server:
  base-url: ${AI_SERVER_URL:http://localhost:8001}

file:
  upload-dir: ${FILE_UPLOAD_DIR:../data/originals}
  crop-dir: ${FILE_CROP_DIR:../data/crops}
  thumbnail-dir: ${FILE_THUMBNAIL_DIR:../data/thumbnails}

