spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRATION_HOURS}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

ai-server:
  base-url: ${AI_SERVER_URL}

file:
  upload-dir: ${FILE_UPLOAD_DIR}
  crop-dir: ${FILE_CROP_DIR}
  thumbnail-dir: ${FILE_THUMBNAIL_DIR:/data/thumbnails}
